; One Knight image. The app writes EEPROM byte 0, then resets.
; PlatformIO Core pulls NeuroPawn. VS Code is not used.
; The linked hex is a local build product. Do not commit it.

[platformio]
default_envs = knight

[env:knight]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_speed = 115200
monitor_speed = 115200
lib_deps = neuropawn/NeuroPawn@^1.2.0
build_unflags =
    -flto
    -fno-fat-lto-objects
build_flags =
    -fno-lto
    -DNEUROPAWN_IMU
    -DEXG_FW_VERSION=3
    -Wl,--wrap=_ZN14HardwareSerial9availableEv
